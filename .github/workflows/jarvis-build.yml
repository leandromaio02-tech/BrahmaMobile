name: jarvis-build

on:
  push:
    branches: [jarvis]
    paths:
      - 'jarvis/**'
      - '.github/workflows/jarvis-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/ct
          unzip -q /tmp/cmdline.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        shell: bash
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Inspect APK
        shell: bash
        run: |
          APK=jarvis/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml' | head -5
          echo "APK size: $(stat -c%s "$APK") bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          APK=jarvis/app/build/outputs/apk/debug/app-debug.apk
          gh release view jarvis-latest >/dev/null 2>&1 || gh release create jarvis-latest --title "J.A.R.V.I.S. rolling build" --notes "Installable debug APK from the jarvis branch."
          gh release upload jarvis-latest "$APK#JARVIS-debug.apk" --clobber
