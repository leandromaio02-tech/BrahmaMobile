name: Build Brahma Mobile APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # contents:write lets the job update the rolling "latest" release that backs
  # the one-tap install link. Pull-request runs are read-only by GitHub anyway.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Install the SDK exactly like a local build: pinned cmdline-tools + platform 34.
      # Avoids android-actions/setup-android, whose defaults broke on recent runners.
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/ct
          unzip -q /tmp/cmdline.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build signed debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q classes.dex
          unzip -l "$APK" | grep -q AndroidManifest.xml
          echo "APK_OK $(stat -c%s "$APK") bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brahma-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      # Rolling release: same URL always serves the newest APK. No PAT required —
      # Actions supplies a token via secrets.GITHUB_TOKEN.
      - name: Publish rolling release (one-tap APK)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/BrahmaMobile-debug.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Brahma Mobile (latest)" \
              --notes "Rolling debug build of Brahma Mobile. Updated automatically on every push. One-tap install: https://github.com/leandromaio02-tech/BrahmaMobile/releases/download/latest/BrahmaMobile-debug.apk"
          gh release upload latest /tmp/BrahmaMobile-debug.apk --clobber
